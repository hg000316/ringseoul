<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>mobile preview</title>
<style>
body{margin:0;background:#ddd;font:12px/1.4 monospace}
.row{display:flex;gap:24px;padding:16px;align-items:flex-start}
figure{margin:0}
figcaption{margin-bottom:6px}
iframe{border:0;background:#fff;display:block;box-shadow:0 2px 12px rgba(0,0,0,.2)}
</style>
</head><body>
<div class="row">
  <figure><figcaption>390 × 844 (iPhone 14)</figcaption>
    <iframe id="fr390" src="/ringseoul/" width="390" height="844"></iframe></figure>
  <figure><figcaption>360 × 740 (Android)</figcaption>
    <iframe id="fr360" src="/ringseoul/" width="360" height="740"></iframe></figure>
</div>
<script>
function focusForm(id) {
  var f = document.getElementById(id);
  f.addEventListener('load', function () {
    try {
      var w = f.contentWindow, d = f.contentDocument;
      var box = d.querySelector('.ask-box');
      if (!box) return;
      var top = box.getBoundingClientRect().top + w.scrollY - 320;
      w.scrollTo(0, Math.max(0, top));
    } catch (e) {}
  });
}
focusForm('fr390');
focusForm('fr360');
</script>
</body></html>
